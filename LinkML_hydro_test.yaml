id: https://w3id.org/hmontology/schema
name: NFDI4Earth-HYOBS-Ontology
description: LinkML schema for the NFDI4Earth-HYOBS-Ontology used to annotate hydrological sensors, catchments, geometries,
  observations, environmental properties, hydrometeorological variables, and water-quality variables across LamaH-CE, CAMELS-GB,
  and QUADICA.
prefixes:
  hyobs: https://w3id.org/hmontology/
  linkml: https://w3id.org/linkml/
  envthes: http://vocabs.lter-europe.net/EnvThes/
  sosa: http://www.w3.org/ns/sosa/
  rdf: http://www.w3.org/1999/02/22-rdf-syntax-ns#
  rdfs: http://www.w3.org/2000/01/rdf-schema#
  geo: http://www.opengis.net/ont/geosparql#
  sf: http://www.opengis.net/ont/sf#
  qudt: http://qudt.org/schema/qudt/
  unit: http://qudt.org/vocab/unit/
  xsd: http://www.w3.org/2001/XMLSchema#
  schema: http://schema.org/
  dct: http://purl.org/dc/terms/
  dbo: http://dbpedia.org/ontology/
  esco: http://data.europa.eu/esco/model#
  chebi: http://purl.obolibrary.org/obo/CHEBI_
default_prefix: hyobs
imports:
- linkml:types
classes:
  AirTemperature2m:
    description: Air temperature at a height of 2 m above Earth surface
    class_uri: hyobs:AirTemperature2m
  AirTemperature2mMax:
    description: Maximum air temperature at 2 metres above the land surface for the observation period.
    class_uri: hyobs:AirTemperature2mMax
    is_a: AirTemperature2m
    title: Air Temperature 2 M Max
  AirTemperature2mMin:
    description: Minimum air temperature at 2 metres above the land surface for the observation period.
    class_uri: hyobs:AirTemperature2mMin
    is_a: AirTemperature2m
    title: Air Temperature 2 M Min
  AirTemperature2mAvg:
    description: Average air temperature at 2 metres above the land surface for the observation period.
    class_uri: hyobs:AirTemperature2mAvg
    is_a: AirTemperature2m
    title: Air Temperature 2 M Avg
  DewPointTemperature2m:
    description: Dew point temperature at a height of 2 m above Earth surface
    class_uri: hyobs:DewPointTemperature2m
  DewPointTemperature2mMax:
    description: Maximum dew point temperature 2 m for an observation period.
    class_uri: hyobs:DewPointTemperature2mMax
    is_a: DewPointTemperature2m
    title: Dew Point Temperature 2 M Max
  DewPointTemperature2mAvg:
    description: Average dew point temperature 2 m for an observation period.
    class_uri: hyobs:DewPointTemperature2mAvg
    is_a: DewPointTemperature2m
    title: Dew Point Temperature 2 M Avg
  DewPointTemperature2mMin:
    description: Minimum dew point temperature 2 m for an observation period.
    class_uri: hyobs:DewPointTemperature2mMin
    is_a: DewPointTemperature2m
    title: Dew Point Temperature 2 M Min
  WindSpeedEast10m:
    description: Eastward component of wind speed at 10 metres above the land surface.
    class_uri: hyobs:WindSpeedEast10m
    title: Wind Speed East 10 M
  WindSpeedNorth10m:
    description: Northward component of wind speed at 10 metres above the land surface.
    class_uri: hyobs:WindSpeedNorth10m
    title: Wind Speed North 10 M
  ForecastAlbedo:
    description: 'Hydrological observed property or controlled vocabulary concept: forecast albedo.'
    class_uri: hyobs:ForecastAlbedo
    title: Forecast Albedo
  HighVegetationGreenLeafArea:
    description: 'Hydrological observed property or controlled vocabulary concept: high vegetation green leaf area.'
    class_uri: hyobs:HighVegetationGreenLeafArea
    title: High Vegetation Green Leaf Area
  LowVegetationGreenLeafArea:
    description: 'Hydrological observed property or controlled vocabulary concept: low vegetation green leaf area.'
    class_uri: hyobs:LowVegetationGreenLeafArea
    title: Low Vegetation Green Leaf Area
  SurfaceNetSolarRadiation:
    description: Class representing observations of surface net solar radiation, i.e., the amount of solar radiation reaching
      the Earth's surface minus the amount reflected by the Earth's surface (governed by albedo); positive sign is an indicator
      for radiation to the Earth
    class_uri: hyobs:SurfaceNetSolarRadiation
  SurfaceNetSolarRadiationMax:
    description: Maximum surface net solar radiation for an observation period.
    class_uri: hyobs:SurfaceNetSolarRadiationMax
    is_a: SurfaceNetSolarRadiation
    title: Surface Net Solar Radiation Max
  SurfaceNetSolarRadiationAvg:
    description: Average surface net solar radiation for an observation period.
    class_uri: hyobs:SurfaceNetSolarRadiationAvg
    is_a: SurfaceNetSolarRadiation
    title: Surface Net Solar Radiation Avg
  SurfaceNetSolarRadiationMin:
    description: Surface Net Solar Radiation (Minimum)
    class_uri: hyobs:SurfaceNetSolarRadiationMin
    is_a: SurfaceNetSolarRadiation
  SurfaceNetThermalRadiation:
    description: Class representing observations of surface thermal radiation, i.e., net thermal radiation at the Earth's
      surface; positive sign is an indicator for radiation from the Earth.
    class_uri: hyobs:SurfaceNetThermalRadiation
  SurfaceNetThermalRadiationMax:
    description: Maximum surface net thermal radiation for an observation period.
    class_uri: hyobs:SurfaceNetThermalRadiationMax
    is_a: SurfaceNetThermalRadiation
    title: Surface Net Thermal Radiation Max
  SurfaceNetThermalRadiationAvg:
    description: Average surface net thermal radiation for an observation period.
    class_uri: hyobs:SurfaceNetThermalRadiationAvg
    is_a: SurfaceNetThermalRadiation
    title: Surface Net Thermal Radiation Avg
  SurfaceNetThermalRadiationMin:
    description: Surface Net Thermal Radiation (Minimum)
    class_uri: hyobs:SurfaceNetThermalRadiationMin
    is_a: SurfaceNetThermalRadiation
  WaterFractionTopsoil:
    description: 'Hydrological observed property or controlled vocabulary concept: water fraction topsoil.'
    class_uri: hyobs:WaterFractionTopsoil
    title: Water Fraction Topsoil
  WaterFractionSubsoil:
    description: 'Hydrological observed property or controlled vocabulary concept: water fraction subsoil.'
    class_uri: hyobs:WaterFractionSubsoil
    title: Water Fraction Subsoil
  GovnrID:
    description: Government ID
    class_uri: hyobs:GovnrID
  Catchment:
    slots:
    - hasRiverBasedRegion
    - has_mvert_dist
    - has_mvert_ang
    - hasHighPrecipitationSeason
    - hasLowPrecipitationSeason
    - hasDominantLandUse
    - hasCatchmentArea
    - meanElevation
    - medianElevation
    - minElevation
    - maxElevation
    - meanSlope
    - slopeMean
    - slopeMedian
    - drainageDensity
    - hasMeanDailyPrecip
    - hasMeanEvapotranspiration
    - hasAridityIndex
    - aridityIndex
    - precipitationSeasonality
    - precipSeasonalityIndex
    - hasSnowFraction
    - hasRunoffRatio
    - baseflowIndex
    - flashinessIndex
    class_uri: envthes:30212
    description: A hydrological catchment or drainage basin represented as a feature of interest for sensors and observations.
  Sensor:
    slots:
    - producesTimeseries
    - monitorsCatchment
    class_uri: sosa:Sensor
    description: A gauging station or sensor that monitors a hydrological catchment and may make observations.
  River:
    slots:
    - hasRiverBasedRegion
    class_uri: envthes:20916
  EvapotranspirationPenmanMonteith:
    class_uri: hyobs:EvapotranspirationPenmanMonteith
    description: Potential evapotranspiration estimated using the Penman-Monteith method.
    exact_mappings:
    - envthes:21299
    title: Evapotranspiration Penman Monteith
  EvapotranspirationPenmanMonteithCorrected:
    class_uri: hyobs:EvapotranspirationPenmanMonteithCorrected
    description: Corrected Penman-Monteith evapotranspiration with interception correction.
    exact_mappings:
    - envthes:21299
  DownwardShortwaveRadiation:
    class_uri: hyobs:DownwardShortwaveRadiation
    description: Solar radiation received at Earth's surface (300-4000 nm).
  LongwaveRadiation:
    class_uri: hyobs:LongwaveRadiation
    description: Thermal radiation emitted by Earth and atmosphere (>4 microm).
    close_mappings:
    - envthes:22164
  Geometry:
    description: Spatial geometry associated with a sensor or catchment.
    class_uri: geo:Geometry
  SpecificDischarge:
    class_uri: hyobs:SpecificDischarge
    description: Discharge normalized by catchment area, commonly expressed as an equivalent water depth per unit time.
    title: Specific Discharge
    is_a: WaterQualityProperty
  RelativeHumidity:
    class_uri: hyobs:RelativeHumidity
    description: Relative humidity of near-surface air.
    title: Relative Humidity
  ShortwaveRadiationFlux:
    class_uri: hyobs:ShortwaveRadiationFlux
    description: Incoming or surface shortwave radiation flux.
    title: Shortwave Radiation Flux
  LongwaveRadiationFlux:
    class_uri: hyobs:LongwaveRadiationFlux
    description: Incoming or surface longwave radiation flux.
    title: Longwave Radiation Flux
  DischargeSampleCount:
    class_uri: hyobs:DischargeSampleCount
    description: Number of discharge samples available for an aggregation period.
    title: Discharge Sample Count
    is_a: WaterQualityProperty
  ConcentrationSampleCount:
    class_uri: hyobs:ConcentrationSampleCount
    description: Number of concentration samples available for an analyte and aggregation period.
    title: Concentration Sample Count
    is_a: WaterQualityProperty
  WRTDS:
    class_uri: hyobs:WRTDS
    description: Weighted Regression on Time, Discharge, and Season procedure used for estimating or normalizing water-quality
      quantities.
    title: Wrtds
    is_a: Procedure
  FlowNormalizedConcentrationSampleCount:
    class_uri: hyobs:FlowNormalizedConcentrationSampleCount
    description: Number of flow-normalized concentration samples available for an analyte and aggregation period.
    title: Flow Normalized Concentration Sample Count
    is_a: WaterQualityProperty
  DischargeMedian:
    class_uri: hyobs:DischargeMedian
    description: Median discharge over the aggregation period.
    title: Discharge Median
    is_a: WaterQualityProperty
  SoluteConcentrationFlowWeightedMean:
    class_uri: hyobs:SoluteConcentrationFlowWeightedMean
    description: Flow-weighted mean concentration of a solute in water.
    title: Solute Concentration Flow Weighted Mean
    is_a: WaterQualityProperty
  SoluteLoadSum:
    class_uri: hyobs:SoluteLoadSum
    description: Total solute load over an aggregation period.
    title: Solute Load Sum
    is_a: WaterQualityProperty
  SoluteMassFluxMean:
    class_uri: hyobs:SoluteMassFluxMean
    description: Mean solute mass flux over an aggregation period.
    title: Solute Mass Flux Mean
    is_a: WaterQualityProperty
  SoluteConcentrationFlowNormalizedMedian:
    class_uri: hyobs:SoluteConcentrationFlowNormalizedMedian
    description: Flow-normalized median concentration of a solute in water.
    title: Solute Concentration Flow Normalized Median
    is_a: WaterQualityProperty
  SoluteConcentrationFlowNormalizedMean:
    class_uri: hyobs:SoluteConcentrationFlowNormalizedMean
    description: Flow-normalized mean concentration of a solute in water.
    title: Solute Concentration Flow Normalized Mean
    is_a: WaterQualityProperty
  SoluteMassFluxFlowNormalizedMean:
    class_uri: hyobs:SoluteMassFluxFlowNormalizedMean
    description: Flow-normalized mean solute mass flux over an aggregation period.
    title: Solute Mass Flux Flow Normalized Mean
    is_a: WaterQualityProperty
  HydrometeorologicalProperty:
    description: Observed hydrometeorological property represented in time-series observations.
    class_uri: hyobs:HydrometeorologicalProperty
  WaterQualityProperty:
    description: Observed water-quality property represented in QUADICA observations.
    class_uri: hyobs:WaterQualityProperty
  Analyte:
    description: Chemical or aggregate analyte used in water-quality observations.
    class_uri: hyobs:Analyte
  Procedure:
    description: Procedure or method used to create or normalize observations.
    class_uri: hyobs:Procedure
slots:
  issueID:
    slot_uri: hyobs:issueID
    range: GovnrID
    description: Official gauge number from the associated governments.
    title: Issue i d
  hasRiverBasedRegion:
    title: River-based region
    slot_uri: hyobs:hasRiverBasedRegion
    range: string
    description: Name or identifier of the river-based region associated with a gauging station or catchment.
  has_mvert_dist:
    slot_uri: hyobs:has_mvert_dist
    range: string
    description: 'Hydrological or environmental attribute: has mvert dist.'
    title: Longest distance from the gauge
  has_mvert_ang:
    slot_uri: hyobs:has_mvert_ang
    range: decimal
    description: 'Hydrological or environmental attribute: has mvert ang.'
    title: Has mvert ang
  monitorsCatchment:
    slot_uri: hyobs:monitorsCatchment
    range: Catchment
    description: Relates a hydrological monitoring sensor or gauging station to the catchment it monitors.
    title: monitors Catchment
  hasHighPrecipitationSeason:
    slot_uri: hyobs:hasHighPrecipitationSeason
    range: string
    description: 'Hydrological or environmental attribute: has high precipitation season.'
    title: has High precipitation season
  hasLowPrecipitationSeason:
    slot_uri: hyobs:hasLowPrecipitationSeason
    range: string
    description: 'Hydrological or environmental attribute: has low precipitation season.'
    title: has Low precipitation season
  hasDominantLandUse:
    slot_uri: hyobs:hasDominantLandUse
    range: string
    description: 'Hydrological or environmental attribute: has dominant land use.'
    title: Dominant land use type
  hasSoil:
    slot_uri: hyobs:hasSoil
    range: string
    description: Connects an area or a point to the soil
    title: Has soil
  hasSoilPorosity:
    slot_uri: hyobs:hasSoilPorosity
    range: string
    description: 'Hydrological or environmental attribute: has soil porosity.'
    title: Soil porosity
  hasSaturatedHydraulicConductivity:
    slot_uri: hyobs:hasSaturatedHydraulicConductivity
    range: decimal
    description: 'Hydrological or environmental attribute: has saturated hydraulic conductivity.'
    title: has Saturated Hydraulic Conductivity
  hasSoilTexture:
    slot_uri: hyobs:hasSoilTexture
    range: string
    description: has soil texture
    title: has soil texture
  hasDominantGeologicalClass:
    slot_uri: hyobs:hasDominantGeologicalClass
    range: string
    description: 'Hydrological or environmental attribute: has dominant geological class.'
    title: Has Dominant Geological Class
  producesTimeseries:
    slot_uri: hyobs:producesTimeseries
    range: string
    description: has Time Series
    title: has Time Series
  elevationGuage:
    slot_uri: hyobs:elevationGuage
    title: Elevation of gauge
    description: Elevation of the gauge's zero point from mean sea level
    range: decimal
  obsBegDaily:
    slot_uri: hyobs:obsBegDaily
    title: Starting Year of Daily Runoff Time Series
    description: Year when the daily runoff time series in the dataset begins
    range: integer
  obsBegHr:
    slot_uri: hyobs:obsBegHr
    title: Starting Year of hourly Runoff Time Series
    description: Year when the hourly runoff time series in the dataset begins
    range: integer
  obsEndHr:
    slot_uri: hyobs:obsEndHr
    title: Observation End Year
    description: Year when the continuous runoff data recording ended, use '0' if ongoing
    range: integer
  hasObsBegTime:
    slot_uri: hyobs:hasObsBegTime
    title: Starting Time of Daily Runoff Time Series
    description: Specific date/year when the daily runoff time series in the dataset begins
    range: integer
  gapsPre:
    slot_uri: hyobs:gapsPre
    title: Fraction of Gaps - Raw Hourly Runoff Time Series
    description: Represents the fraction of gaps in the raw hourly runoff time series
    range: decimal
  gapsPost:
    slot_uri: hyobs:gapsPost
    title: Fraction of Gaps - Processed Hourly Runoff Time Series
    description: Represents Fraction of gaps in the hourly runoff time series after processing
    range: decimal
  areaRatio:
    slot_uri: hyobs:areaRatio
    title: Area Ratio
    description: Ratio between variable area_calc of basin delineation A and area_gov
    range: decimal
  euHydroID:
    slot_uri: hyobs:euHydroID
    title: EU-Hydro - River Network ID
    description: OBJECT_ID of the next river segment from stream network EU-Hydro - River Network Database
    range: string
  hyrivID:
    slot_uri: hyobs:hyrivID
    title: RiverATLAS ID
    description: HYRIV_ID of the next river segment from stream network RiverATLAS
    range: string
  meanElevation:
    slot_uri: hyobs:meanElevation
    title: Mean Elevation
    description: Mean elevation of a catchment or spatial unit, normally expressed as a QUDT quantity value in metres.
    range: decimal
  medianElevation:
    slot_uri: hyobs:medianElevation
    title: Median Elevation
    description: Median elevation of a catchment or spatial unit, normally expressed as a QUDT quantity value in metres.
    range: decimal
  standardDeviationElevation:
    slot_uri: hyobs:standardDeviationElevation
    title: Standard Deviation of Elevation
    description: 'Hydrological or environmental attribute: standard deviation elevation.'
    range: decimal
  elevationRange:
    slot_uri: hyobs:elevationRange
    title: Elevation Range
    description: 'Hydrological or environmental attribute: elevation range.'
    range: decimal
  meanSlope:
    slot_uri: hyobs:meanSlope
    title: Mean Slope
    description: Mean terrain slope of a catchment or spatial unit.
    range: decimal
  precipitationSeasonality:
    slot_uri: hyobs:precipitationSeasonality
    title: Precipitation Seasonality
    description: Seasonality index describing the timing and distribution of precipitation through the year.
    range: decimal
  elonRatio:
    slot_uri: hyobs:elonRatio
    title: Elongation Ratio
    description: Ratio between the diameter of an equivalent circle and the area of the catchment area to its length
    range: decimal
  hasStrmDensity:
    slot_uri: hyobs:hasStrmDensity
    title: Stream Density
    description: Ratio of lengths of streams LF and the catchment area A, DF=sumLFA
    range: decimal
  hasPSeason:
    slot_uri: hyobs:hasPSeason
    title: Precipitation Seasonality
    description: Seasonality and timing of precipitation using sine curves; positive values for summer-dominated, negative
      for winter-dominated precipitation
    range: decimal
  hasMeanDailyPrecip:
    slot_uri: hyobs:hasMeanDailyPrecip
    title: Mean Daily Precipitation
    description: Long-term mean daily precipitation for a catchment or spatial unit.
    range: decimal
  hasMeanEvapotranspiration:
    slot_uri: hyobs:hasMeanEvapotranspiration
    title: Mean Daily Evapotranspiration
    description: Long-term mean daily evapotranspiration for a catchment or spatial unit.
    range: decimal
  hasReferenceEvapotranspiration:
    slot_uri: hyobs:hasReferenceEvapotranspiration
    title: Reference Evapotranspiration
    description: 'Hydrological or environmental attribute: has reference evapotranspiration.'
    range: decimal
  hasAridityIndex:
    slot_uri: hyobs:hasAridityIndex
    title: Aridity Index
    description: Aridity index of a catchment or spatial unit.
    range: decimal
  hasReciprocalAridityIndex:
    slot_uri: hyobs:hasReciprocalAridityIndex
    title: Reciprocal Aridity Index
    description: 'Hydrological or environmental attribute: has reciprocal aridity index.'
    range: decimal
  hasSnowFraction:
    slot_uri: hyobs:hasSnowFraction
    title: Snow Fraction
    description: Fraction of precipitation that falls as snow.
    range: decimal
  hasHighPrecFrequency:
    slot_uri: hyobs:hasHighPrecFrequency
    title: High Precipitation Frequency
    description: 'Hydrological or environmental attribute: has high prec frequency.'
    range: decimal
  hasHighPrecipitationDuration:
    slot_uri: hyobs:hasHighPrecipitationDuration
    title: High Precipitation Duration
    description: 'Hydrological or environmental attribute: has high precipitation duration.'
    range: decimal
  hasLowPrecFrequency:
    slot_uri: hyobs:hasLowPrecFrequency
    title: Low Precipitation Frequency
    description: 'Hydrological or environmental attribute: has low prec frequency.'
    range: decimal
  hasLowPrecipitationDuration:
    slot_uri: hyobs:hasLowPrecipitationDuration
    title: Low Precipitation Duration
    description: 'Hydrological or environmental attribute: has low precipitation duration.'
    range: decimal
  hasAgriculturalAreaFraction:
    slot_uri: hyobs:hasAgriculturalAreaFraction
    title: Agricultural Area Fraction
    description: Fractional value describing agricultural area fraction for a catchment or spatial unit.
    range: decimal
  hasBareAreaFraction:
    slot_uri: hyobs:hasBareAreaFraction
    title: Bare Area Fraction
    description: Fractional value describing bare area fraction for a catchment or spatial unit.
    range: decimal
  hasForestAreaFraction:
    slot_uri: hyobs:hasForestAreaFraction
    title: Forest Area Fraction
    description: Fractional value describing forest area fraction for a catchment or spatial unit.
    range: decimal
  hasGlacierAreaFraction:
    slot_uri: hyobs:hasGlacierAreaFraction
    title: Glacier Area Fraction
    description: Fractional value describing glacier area fraction for a catchment or spatial unit.
    range: decimal
  hasLakeAreaFraction:
    slot_uri: hyobs:hasLakeAreaFraction
    title: Lake Area Fraction
    description: Fractional value describing lake area fraction for a catchment or spatial unit.
    range: decimal
  hasUrbanAreaFraction:
    slot_uri: hyobs:hasUrbanAreaFraction
    title: Urban Area Fraction
    description: Fractional value describing urban area fraction for a catchment or spatial unit.
    range: decimal
  hasMaxLeafAreaIndex:
    slot_uri: hyobs:hasMaxLeafAreaIndex
    title: Maximum Average Leaf Area Index
    description: 'Hydrological or environmental attribute: has max leaf area index.'
    range: decimal
  hasRangeLeafAreaIndex:
    slot_uri: hyobs:hasRangeLeafAreaIndex
    title: Range of Average Leaf Area Index
    description: 'Hydrological or environmental attribute: has range leaf area index.'
    range: decimal
  hasMaxNDVI:
    slot_uri: hyobs:hasMaxNDVI
    title: Maximum Average NDVI
    description: 'Hydrological or environmental attribute: has max ndvi.'
    range: decimal
  hasMinNDVI:
    slot_uri: hyobs:hasMinNDVI
    title: Minimum Average NDVI
    description: 'Hydrological or environmental attribute: has min ndvi.'
    range: decimal
  hasMaxGreenVegetationFraction:
    slot_uri: hyobs:hasMaxGreenVegetationFraction
    title: Maximum Green Vegetation Fraction
    description: Fractional value describing max green vegetation fraction for a catchment or spatial unit.
    range: decimal
  hasRangeGreenVegetationFraction:
    slot_uri: hyobs:hasRangeGreenVegetationFraction
    title: Range of Green Vegetation Fraction
    description: Fractional value describing range green vegetation fraction for a catchment or spatial unit.
    range: decimal
  hasDepthToBedrock:
    slot_uri: hyobs:hasDepthToBedrock
    title: Depth to Bedrock
    description: Depth to bedrock from the surface of a point or an area
    range: decimal
  hasRootDepth:
    slot_uri: hyobs:hasRootDepth
    title: Available Root Depth
    description: Depth available for roots in soil layer from the surface
    range: decimal
  hasTotalAvailableWaterContent:
    slot_uri: hyobs:hasTotalAvailableWaterContent
    title: Total Available Water Content
    description: 'Hydrological or environmental attribute: has total available water content.'
    range: decimal
  hasSandFraction:
    slot_uri: hyobs:hasSandFraction
    title: Sand Fraction
    description: Fractional value describing sand fraction for a catchment or spatial unit.
    range: decimal
  hasSiltFraction:
    slot_uri: hyobs:hasSiltFraction
    title: Silt Fraction
    description: Fractional value describing silt fraction for a catchment or spatial unit.
    range: decimal
  hasClayFraction:
    slot_uri: hyobs:hasClayFraction
    title: Clay Fraction
    description: Fractional value describing clay fraction for a catchment or spatial unit.
    range: decimal
  hasGravelFraction:
    slot_uri: hyobs:hasGravelFraction
    title: Gravel Fraction
    description: Gravel fraction of a soil material
    range: decimal
  hasOrganicFraction:
    slot_uri: hyobs:hasOrganicFraction
    title: Organic Fraction
    description: Fractional value describing organic fraction for a catchment or spatial unit.
    range: decimal
  hasIceAndGlacierFraction:
    slot_uri: hyobs:hasIceAndGlacierFraction
    title: Ice and Glacier Fraction
    description: Fractional value describing ice and glacier fraction for a catchment or spatial unit.
    range: decimal
  hasMetamorphitesFraction:
    slot_uri: hyobs:hasMetamorphitesFraction
    title: Metamorphites Fraction
    description: Fractional value describing metamorphites fraction for a catchment or spatial unit.
    range: decimal
  hasAcidPlutonicRocksFraction:
    slot_uri: hyobs:hasAcidPlutonicRocksFraction
    title: Acid Plutonic Rocks Fraction
    description: Fractional value describing acid plutonic rocks fraction for a catchment or spatial unit.
    range: decimal
  hasBasicPlutonicRocksFraction:
    slot_uri: hyobs:hasBasicPlutonicRocksFraction
    title: Basic Plutonic Rocks Fraction
    description: Fractional value describing basic plutonic rocks fraction for a catchment or spatial unit.
    range: decimal
  hasIntermediatePlutonicRocksFraction:
    slot_uri: hyobs:hasIntermediatePlutonicRocksFraction
    title: Intermediate Plutonic Rocks Fraction
    description: Fractional value describing intermediate plutonic rocks fraction for a catchment or spatial unit.
    range: decimal
  hasPyroclasticsFraction:
    slot_uri: hyobs:hasPyroclasticsFraction
    title: Pyroclastics Fraction
    description: Fractional value describing pyroclastics fraction for a catchment or spatial unit.
    range: decimal
  hasCarbonateSedimentaryRocksFraction:
    slot_uri: hyobs:hasCarbonateSedimentaryRocksFraction
    title: Carbonate Sedimentary Rocks Fraction
    description: Fractional value describing carbonate sedimentary rocks fraction for a catchment or spatial unit.
    range: decimal
  hasMixedSedimentaryRocksFraction:
    slot_uri: hyobs:hasMixedSedimentaryRocksFraction
    title: Mixed Sedimentary Rocks Fraction
    description: Fractional value describing mixed sedimentary rocks fraction for a catchment or spatial unit.
    range: decimal
  hasSiliciclasticSedimentaryRocksFraction:
    slot_uri: hyobs:hasSiliciclasticSedimentaryRocksFraction
    title: Siliciclastic Sedimentary Rocks Fraction
    description: Fractional value describing siliciclastic sedimentary rocks fraction for a catchment or spatial unit.
    range: decimal
  hasUnconsolidatedSedimentsFraction:
    slot_uri: hyobs:hasUnconsolidatedSedimentsFraction
    title: Unconsolidated Sediments Fraction
    description: Fractional value describing unconsolidated sediments fraction for a catchment or spatial unit.
    range: decimal
  hasAcidVolcanicRocksFraction:
    slot_uri: hyobs:hasAcidVolcanicRocksFraction
    title: Acid Volcanic Rocks Fraction
